# Short venue labels: the badge on the left of every paper (Papers page) and in "Featured publications" (main page).
# The first entry whose `match` text occurs in the paper's journal / booktitle / series is used (case-sensitive),
# so more specific texts must come before more general ones.
# Papers without a match show "Journal" or "Conference".

# journals
- match: "Reconfigurable Technology and Systems"
  abbr: TRETS
  name: "ACM Transactions on Reconfigurable Technology and Systems"
- match: "Journal of Systems Architecture"
  abbr: JSA
  name: "Journal of Systems Architecture"
- match: "Journal of Real-Time Image Processing"
  abbr: JRTIP
  name: "Journal of Real-Time Image Processing"
- match: "Journal of Signal Processing Systems"
  abbr: JSPS
  name: "Journal of Signal Processing Systems"
- match: "Low Power Electronics"
  abbr: JLPEA
  name: "Journal of Low Power Electronics and Applications"
- match: "International Journal of Electronics and Telecommunications"
  abbr: IJET
  name: "International Journal of Electronics and Telecommunications"
- match: "Microprocessors and Microsystems"
  abbr: MICPRO
  name: "Microprocessors and Microsystems"
- match: "Sensors"
  abbr: Sensors
  name: "Sensors"
- match: "Electronics"
