# Partners listed on the Collaboration page (/collaboration/).
# Fields: id (short key used in the `collaboration` field of _bibliography/papers.bib),
#         name, institution, category (Academic | Industry | Erasmus+), country, url,
#         logo (file in assets/img/collaboration/), logo_fit (optional: contain = centred on white with padding),
#         collaborators (comma-separated),
#         description, keywords (list)

- id: ctu
  name: "Neuro-inspired Perception and Cognition Lab"
  institution: "Czech Technical University in Prague"
  category: Academic
  country: Czech Republic
  url: https://giuliadangelo.github.io/html/npclab.html
  logo: cvut.jpg
  collaborators: "Giulia D'Angelo, Karla Štěpánová, Rayane Rocha, Paolo Ritirato"
  description: >-
    We explore efficient perception using bio-inspired sensors and neuromorphic computing paradigms,
    focusing on multimodal event-based visual attention and efficient hardware processing of asynchronous, sparse data.
  keywords:
    - Neuromorphic Computing
    - Event Camera
    - Visual Attention
    - Spiking Neural Networks

- id: paderborn
  name: "Computer Engineering Group"
  institution: "Paderborn University"
  category: Academic
  country: Germany
  url: https://cs.uni-paderborn.de/en/technische-informatik
  logo: paderborn.jpg
  logo_fit: contain
  collaborators: "Christoph Berganski, Felix Jentzsch"
  description: >-
    We collaborate on compiler optimizations for FPGA dataflow accelerators of quantized neural networks built with the open-source
    FINN framework. Together we developed scaled-integer range analysis (SIRA), which tracks the range, scale and bias of every tensor
    to generate smaller and more efficient streaming hardware.
  keywords:
    - FPGA
    - Quantized Neural Networks
    - Range Analysis
    - Hardware-Aware Compilation

- id: amd
  name: "AMD Research & Advanced Development"
  category: Academic
  url: https://xilinx.github.io/finn/
  logo: amd.svg
  logo_fit: contain
  collaborators: "Michaela Blott, Yaman Umuroglu, Thomas Preusser, Jakoba Petri-Koenig, Ian Colbert"
  description: >-
    We collaborate on the efficient deployment of quantized neural networks on FPGAs using the open-source FINN dataflow compiler.
    Our joint work on scaled-integer range analysis (SIRA) reduces accumulator bitwidths and folds scales, biases and elementwise
    operations into thresholds, cutting the resource usage of FPGA dataflow accelerators.
  keywords:
    - FPGA
    - Quantized Neural Networks
    - Dataflow Accelerators
    - FINN Compiler

- id: ntnu
  name: "Computer Architecture Laboratory (CAL)"
  institution: "Norwegian University of Science and Technology (NTNU)"
  category: Academic
  country: Norway
  url: https://www.ntnu.edu/idi/lab/cal
  logo: ntnu.svg
  logo_fit: contain
  collaborators: "Magnus Själander, Charalampos Bezaitis, Yaman Umuroglu"
  description: >-
    We collaborate on energy-efficient hardware for AI at the edge, focusing on FPGA dataflow accelerators for quantized neural networks.
    Our joint work on scaled-integer range analysis (SIRA) uses interval arithmetic to derive the range, scale and bias of tensors,
    enabling narrower accumulators and cheaper streaming hardware.
  keywords:
    - FPGA
    - Edge AI
    - Quantized Neural Networks
    - Energy-Efficient Computer Architecture

- id: cea
  name: "Digital Systems and Integrated Circuits Division"
  institution: "CEA-List Grenoble"
  category: Academic
  country: France
  url: https://list.cea.fr/en/
  logo: cea.svg
  logo_fit: contain
  collaborators: "Thomas Dalgaty, Thomas Mesquida, Manon Dampfhoffer"
  description: >-
    We collaborated on implementation of graph neural networks for event-based data, mainly event audio sensors.
    We developed the first embedded solutions for audio classification and keyword spotting using SoC FPGA devices.
  keywords:
    - FPGA
    - Graph Neural Networks
    - Event Audio

