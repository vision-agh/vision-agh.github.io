- id: sevilla
  name: "Robotics and Technology of Computers Lab (RTC)"
  institution: "Universidad de Sevilla"
  category: Academic
  country: Spain
  url: https://www.rtc.us.es/staff/
  logo: sevilla.png
  logo_fit: contain
  collaborators: "Angel Jiménez-Fernández, Antonio Rios-Navarro, Tomás Muñoz, Alejandro Linares-Barranco"
  description: >-
    We investigate the design of hardware-aware algorithms for event-based data processing on FPGAs, utilising audio data from
    Neuromorphic Auditory Sensors and visual data from Dynamic Vision Sensors. We combine our expertise in reconfigurable logic
    design with event-based perception.
  keywords:
    - Event Camera
    - Neuromorphic Auditory Sensors
    - Reconfigurable Logic
    - FPGA
    - Hardware-Aware Design

- id: insa
  name: "VAADER team, Institute of Electronics and Digital Technologies (IETR)"
  institution: "National Institute of Applied Sciences (INSA) of Rennes"
  category: Academic
  country: France
  url: https://www.ietr.fr/en/vaader-video-analysis-and-architecture-design-embedded-resources-team#p-4581
  logo: insa.png
  logo_fit: contain
  description: >-
    We collaborated on applying Tangled Program Graphs (TPGs) to autonomous UAV control. We have compared their performance with
    deep reinforcement learning (DRL) in a task involving autonomous flight through an unknown environment.
  keywords:
    - Tangled Program Graph (TPG)
    - GEGELATI
    - Deep Reinforcement Learning (DRL)

